---
# Install tasks for Fluent Bit

- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"

- name: Add Fluent Bit GPG key
  ansible.builtin.get_url:
    url: https://packages.fluentbit.io/fluentbit.key
    dest: /etc/apt/keyrings/fluentbit.asc
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"

- name: Remove legacy one-line Fluent Bit repository files
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/packages_fluentbit_io_{{ item }}_{{ ansible_facts['distribution_release'] }}.list"
    state: absent
  loop:
    - debian
    - ubuntu
  when: ansible_facts['os_family'] == "Debian"
  notify: Update apt cache

- name: Install python-debian (required by deb822_repository)
  ansible.builtin.apt:
    name: python3-debian
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Add Fluent Bit repository
  ansible.builtin.deb822_repository:
    name: fluentbit
    types: deb
    uris: "https://packages.fluentbit.io/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: /etc/apt/keyrings/fluentbit.asc
    state: present
  when: ansible_facts['distribution'] in ["Debian", "Ubuntu"]
  notify: Update apt cache

- name: Update apt cache before install
  ansible.builtin.meta: flush_handlers

- name: Install Fluent Bit package
  ansible.builtin.package:
    name: fluent-bit
    state: present

- name: Ensure Fluent Bit service is enabled
  ansible.builtin.systemd:
    name: fluent-bit
    enabled: true
  ignore_errors: "{{ ansible_facts['virtualization_type'] == 'podman' or ansible_facts['virtualization_type'] == 'docker' }}"
